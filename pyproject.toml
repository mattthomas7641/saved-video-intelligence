[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=app --cov-report=term-missing"
# Without this, `app` is only importable when invoked as `python -m pytest`
# (which adds cwd to sys.path) - bare `pytest` doesn't, and that's exactly
# what broke the first real CI run. pythonpath makes it invocation-agnostic.
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
# Auto-generated by `alembic revision --autogenerate` - not hand-authored,
# and shouldn't be reformatted to match our style on every regeneration.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length - several long prompt/config strings read better unwrapped
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Body()/File() in argument defaults is the framework's
# own idiom, not the mutable-default-argument bug B008 exists to catch.
"app/main.py" = ["B008"]
# Deliberate: SCANNER_DATA_DIR must be set before any app.* import, so these
# imports can't move to the top of the file.
"tests/conftest.py" = ["E402"]
