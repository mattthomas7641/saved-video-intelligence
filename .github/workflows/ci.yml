name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        # Catches exactly the class of bug that bit `playwright install --with-deps`
        # earlier in development: the Dockerfile looked fine until it was actually
        # built. No push - this only needs to prove the image still builds.
        run: docker build -t saved-video-intelligence:ci .
