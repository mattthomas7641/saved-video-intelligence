{# The Sidequest mark: a path that branches off the main road toward a quest marker. #}
{% macro logo(size=22) -%}
<svg class="logo" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <rect width="32" height="32" rx="8" fill="var(--ink)"/>
  <path d="M11 27V5M11 20c0-5 10-4 10-9.5" stroke="var(--bg)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M21 3.5l4 4-4 4-4-4z" fill="#F0643C"/>
</svg>
{%- endmacro %}
