{% from "_icons.html" import icon %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Saved Scanner{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% block body %}
  <header class="topbar">
    <a href="/dashboard" class="brand">Saved Scanner</a>
    <nav>
      <a class="btn btn-quiet" href="/dashboard">{{ icon("library") }} Library</a>
      <a class="btn btn-quiet" href="/onboarding">{{ icon("upload") }} Import</a>
      <a class="btn btn-quiet" href="/settings">{{ icon("settings") }} Settings</a>
    </nav>
  </header>
  <main class="plain-main">{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
