{% from "_icons.html" import icon %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sidequest{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body {% block bodyattrs %}{% endblock %}>
{% block body %}
  <header class="topbar">
    <a href="/" class="brand">Sidequest</a>
    <nav>
      <a class="btn btn-quiet" href="/">{{ icon("inbox") }} Quests</a>
      <a class="btn btn-quiet" href="/dashboard">{{ icon("library") }} Archive</a>
      <a class="btn btn-quiet" href="/settings">{{ icon("settings") }} Settings</a>
    </nav>
  </header>
  <main class="plain-main">{% block content %}{% endblock %}</main>
{% endblock %}
</body>
</html>
